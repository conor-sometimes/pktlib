name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run mypy --strict src/pktlib
      - run: uv run pyright src/pktlib
      - run: uv run pyright --verifytypes pktlib --ignoreexternal
      - run: uvx zizmor@1.31.1 --offline .github  # the workflows themselves

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked --python ${{ matrix.python }}
      # one leg also measures coverage, and fails under the floor in pyproject.toml
      - run: uv run pytest -q ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && '--cov --cov-report=term' || '' }}
