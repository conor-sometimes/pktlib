name: Release

# Push a tag like v0.2.0 (matching the version in pyproject.toml) to publish to PyPI.
# Publishing uses PyPI Trusted Publishing: no token is stored anywhere. On PyPI, the
# pktlib project trusts this repository, this workflow file and the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false  # a release builds from nothing cached
      - name: The tag is the version
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv build
      - name: The wheel works on its own
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/python -c "import pktlib; net = pktlib.new(); net.router('R1', '2911'); net.to_bytes(); print(pktlib.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pktlib/
    permissions:
      id-token: write  # Trusted Publishing, and the signed attestations PyPI shows
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
